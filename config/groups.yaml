# Validation Groups Configuration
# This file defines the validation groups for column-based data validation

groups:
  - group_id: 1
    product_type: "BOND"
    message_type: "TRADE"
    description: "Bond trade data validation with 18 required columns"
    required_columns:
      - "business_date"
      - "exch_product_id"
      - "product_type"
      - "exchange"
      - "source"
      - "settle_speed"
      - "last_trade_price"
      - "last_trade_yield"
      - "last_trade_yield_type"
      - "last_trade_volume"
      - "last_trade_turnover"
      - "last_trade_interest"
      - "last_trade_side"
      - "level"
      - "status"
      - "receive_time"
      - "settle_date"

  - group_id: 2
    product_type: "BOND"
    message_type: "QUOTE"
    description: "Bond quote data validation with 60 required columns (6 price levels x 10 fields)"
    required_columns:
      # Base identifiers
      - "business_date"
      - "exch_product_id"
      - "product_type"
      - "exchange"
      - "source"
      - "settle_speed"
      # Bid/offer levels 0-5
      - "bid_0_price"
      - "bid_0_yield"
      - "bid_0_yield_type"
      - "bid_0_tradable_volume"
      - "bid_0_volume"
      - "offer_0_price"
      - "offer_0_yield"
      - "offer_0_yield_type"
      - "offer_0_tradable_volume"
      - "offer_0_volume"
      - "bid_1_price"
      - "bid_1_yield"
      - "bid_1_yield_type"
      - "bid_1_tradable_volume"
      - "bid_1_volume"
      - "offer_1_price"
      - "offer_1_yield"
      - "offer_1_yield_type"
      - "offer_1_tradable_volume"
      - "offer_1_volume"
      - "bid_2_price"
      - "bid_2_yield"
      - "bid_2_yield_type"
      - "bid_2_tradable_volume"
      - "bid_2_volume"
      - "offer_2_price"
      - "offer_2_yield"
      - "offer_2_yield_type"
      - "offer_2_tradable_volume"
      - "offer_2_volume"
      - "bid_3_price"
      - "bid_3_yield"
      - "bid_3_yield_type"
      - "bid_3_tradable_volume"
      - "bid_3_volume"
      - "offer_3_price"
      - "offer_3_yield"
      - "offer_3_yield_type"
      - "offer_3_tradable_volume"
      - "offer_3_volume"
      - "bid_4_price"
      - "bid_4_yield"
      - "bid_4_yield_type"
      - "bid_4_tradable_volume"
      - "bid_4_volume"
      - "offer_4_price"
      - "offer_4_yield"
      - "offer_4_yield_type"
      - "offer_4_tradable_volume"
      - "offer_4_volume"
      - "bid_5_price"
      - "bid_5_yield"
      - "bid_5_yield_type"
      - "bid_5_tradable_volume"
      - "bid_5_volume"
      - "offer_5_price"
      - "offer_5_yield"
      - "offer_5_yield_type"
      - "offer_5_tradable_volume"
      - "offer_5_volume"

  - group_id: 3
    product_type: "BOND_FUT"
    message_type: "SNAPSHOT"
    description: "Bond futures snapshot data validation with 39 required columns (trade + market summary + quote levels 0-1)"
    required_columns:
      # Base identifiers
      - "business_date"
      - "exch_product_id"
      - "product_type"
      - "exchange"
      - "source"
      - "settle_speed"
      # Trade data (same as BOND TRADE)
      - "last_trade_price"
      - "last_trade_yield"
      - "last_trade_yield_type"
      - "last_trade_volume"
      - "last_trade_turnover"
      - "last_trade_interest"
      - "last_trade_side"
      - "level"
      - "status"
      # Market summary data
      - "pre_close_price"
      - "pre_settle_price"
      - "pre_interest"
      - "open_price"
      - "high_price"
      - "low_price"
      - "close_price"
      - "settle_price"
      - "upper_limit"
      - "lower_limit"
      - "total_volume"
      - "total_turnover"
      - "open_interest"
      # Quote data (levels 0-1 only)
      - "bid_0_price"
      - "bid_0_yield"
      - "bid_0_yield_type"
      - "bid_0_tradable_volume"
      - "bid_0_volume"
      - "offer_0_price"
      - "offer_0_yield"
      - "offer_0_yield_type"
      - "offer_0_tradable_volume"
      - "offer_0_volume"
      - "bid_1_price"
      - "bid_1_yield"
      - "bid_1_yield_type"
      - "bid_1_tradable_volume"
      - "bid_1_volume"
      - "offer_1_price"
      - "offer_1_yield"
      - "offer_1_yield_type"
      - "offer_1_tradable_volume"
      - "offer_1_volume"
